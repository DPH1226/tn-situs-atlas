# Statewide layers. Pulled once; filtered by county at run time.
layers:
  - id: dor_tax_rate_boundaries
    role: authoritative_tax_boundary
    custodian: Tennessee Department of Revenue
    url: https://tnmap.tn.gov/arcgis/rest/services/COMMUNITY/REVENUE_TAX_RATE_BOUNDARIES/MapServer/0
    cadence: quarterly
    county_field: COUNTY
  - id: dor_cbid
    role: rate_overlay
    custodian: Tennessee Department of Revenue
    url: https://tnmap.tn.gov/arcgis/rest/services/COMMUNITY/REVENUE_TAX_RATE_BOUNDARIES/MapServer/1
    cadence: quarterly
  - id: dor_tdz
    role: rate_overlay
    custodian: Tennessee Department of Revenue
    url: https://tnmap.tn.gov/arcgis/rest/services/COMMUNITY/REVENUE_TAX_RATE_BOUNDARIES/MapServer/2
    cadence: quarterly
  - id: sst_address_lookup
    role: dor_address_range_situs
    custodian: Tennessee Department of Revenue
    url: https://tnmap.tn.gov/arcgis/rest/services/COMMUNITY/SST/MapServer/4
    cadence: quarterly
    geom: false
    county_field: county          # lower-case field; filter on NAME, never countyno (misaligned)
  - id: comptroller_cities
    role: certified_municipal_boundary
    custodian: TN Comptroller, Office of Local Government
    url: https://tnmap.tn.gov/arcgis/rest/services/COMMUNITY/SST/MapServer/2
    cadence: monthly
    notes: "NOT ADMINISTRATIVE_BOUNDARIES/0 (June 2017)."
  - id: sst_counties
    role: county_boundary
    custodian: TN Comptroller
    url: https://tnmap.tn.gov/arcgis/rest/services/COMMUNITY/SST/MapServer/3
    cadence: monthly
  - id: ng911_address_points
    role: rooftop_address_points
    custodian: TN Emergency Communications Board
    url: https://services1.arcgis.com/YuVBSS7Y1of2Qud1/arcgis/rest/services/Tennessee_NG911_Address_Points/FeatureServer/0
    cadence: monthly
    county_field: County
    out_fields: OBJECTID,Add_Number,St_PreDir,St_Name,St_PosTyp,St_PosDir,StNam_Full,Unit,County,Inc_Muni,Post_City,Census_Plc,Zip_Code,Parcel_ID,Placement,Lifecycle
  - id: ng911_roads
    role: road_context
    custodian: TN Emergency Communications Board
    url: https://services1.arcgis.com/YuVBSS7Y1of2Qud1/arcgis/rest/services/Tennessee_NG911_Road_Centerlines/FeatureServer/1
    cadence: monthly
    county_where: "COUNTY_L='{county}' OR COUNTY_R='{county}'"
    out_fields: OBJECTID,LABEL,CFCC
watch:
  # Cheap change signals polled before any bulk pull.
  - id: sst_boundary_release
    url: https://www.tn.gov/revenue/taxes/sales-and-use-tax/streamlined-sales-tax.html
    kind: html_regex
    pattern: "TNB(20[0-9]{2})Q([1-4])[A-Z]{3}[0-9]{2}\\.zip"
  - id: dor_notices
    url: https://www.tn.gov/revenue/tax-resources/legal-resources/important-notices/sales-and-use-tax.html
    kind: html_regex
    pattern: "sales(2[0-9])-([0-9]{2})\\.pdf"
